<title>Work queue — Master DB</title>
<style>
  :root {
    --ground: #f5f6f9;
    --surface: #ffffff;
    --ink: #1a2030;
    --muted: #616b7d;
    --faint: #8a93a3;
    --line: #e5e8f0;
    --line-strong: #d3d8e4;
    --accent: #33408a;
    --accent-soft: #eef0f8;

    --ready-fg:#1f6b4a; --ready-bg:#e6f2ea; --ready-bar:#2f9d6b;
    --stuck-fg:#a5382c; --stuck-bg:#fbe7e3; --stuck-bar:#d0503f;
    --groom-fg:#87590f; --groom-bg:#f6edd7; --groom-bar:#c9962f;
    --review-fg:#2a4f99; --review-bg:#e6eefb; --review-bar:#3f6fd0;
    --qa-fg:#5a3d90; --qa-bg:#eee7f7; --qa-bar:#7d5bc0;
    --deploy-fg:#166a70; --deploy-bg:#def0f0; --deploy-bar:#2b9aa0;
    --prog-fg:#434d69; --prog-bg:#ebedf3; --prog-bar:#6b76a0;

    --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }

  header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  }
  .eyebrow b { color: var(--accent); font-weight: 600; }
  h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.05;
    font-weight: 640;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .legend {
    font-size: 12.5px; color: var(--muted); max-width: 68ch;
    border-left: 2px solid var(--line-strong); padding-left: 12px;
  }

  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 18px; }
  .stat {
    appearance: none; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; padding: 9px 13px 9px 11px;
    display: flex; align-items: baseline; gap: 9px;
    font-family: var(--sans); color: var(--ink);
    transition: border-color .12s ease, box-shadow .12s ease;
    border-left-width: 3px; border-left-style: solid;
  }
  .stat:hover { border-color: var(--line-strong); }
  .stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stat[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--accent); border-color: var(--accent); }
  .stat .n { font-family: var(--mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .l { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .stat.all { border-left-color: var(--accent); }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .search {
    flex: 1 1 240px; min-width: 200px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 12px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .search svg { width: 15px; height: 15px; color: var(--faint); flex: none; }
  .search input { border: 0; outline: 0; background: transparent; width: 100%; font-family: var(--sans); font-size: 13.5px; color: var(--ink); }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    padding: 8px 13px; font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg .lab { color: var(--faint); font-family: var(--mono); font-size: 11.5px; letter-spacing:.06em; text-transform: uppercase; align-self: center; padding: 0 4px 0 2px; }

  .tablecard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #fbfbfd;
    text-align: left; font-weight: 600;
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
    padding: 11px 14px; border-bottom: 1px solid var(--line-strong);
    white-space: nowrap;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.row:hover td { background: #fafbfe; }

  td.id { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.id a { color: var(--accent); text-decoration: none; font-size: 13px; }
  td.id a:hover { text-decoration: underline; }
  .row { border-left: 3px solid transparent; }

  td.title { min-width: 300px; }
  .title .flags { display: inline-flex; gap: 5px; margin-left: 7px; vertical-align: middle; }
  .tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 5px; border-radius: 4px; font-weight: 600; white-space: nowrap;
  }
  .tag.due { color: var(--groom-fg); background: var(--groom-bg); }
  .tag.security, .tag.stale, .tag.bug { color: var(--stuck-fg); background: var(--stuck-bg); }
  .tag.epic { color: var(--prog-fg); background: var(--prog-bg); }
  .tag.win { color: var(--ready-fg); background: var(--ready-bg); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 550; white-space: nowrap;
    padding: 3px 9px 3px 8px; border-radius: 20px;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  td.proj { color: var(--muted); white-space: nowrap; }
  td.team { color: var(--faint); font-size: 12.5px; white-space: nowrap; }

  tr.grp td { background: #f3f4f8; border-bottom: 1px solid var(--line-strong); padding: 8px 14px; }
  tr.grp .ghead { display: flex; align-items: center; gap: 9px; }
  tr.grp .gname { font-weight: 650; font-size: 12.5px; letter-spacing: .02em; }
  tr.grp .gcount { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  tr.grp .gdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .empty { padding: 40px; text-align: center; color: var(--faint); font-size: 13px; }
  footer { margin-top: 18px; font-size: 11.5px; color: var(--faint); font-family: var(--mono); letter-spacing: .03em; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 620px) {
    h1 { font-size: 24px; }
    td.team, thead th.team { display: none; }
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">
      <span>Master Database</span><span>·</span><b>__ASSIGNEE__</b><span>·</span>
      <span id="openCount">tickets</span><span>·</span><span>__DATE__</span>
    </div>
    <h1>My work queue</h1>
    <p class="legend">Buckets group the raw Notion statuses by pipeline stage.</p>
  </header>

  <div class="summary" id="summary" role="group" aria-label="Filter by stage"></div>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Filter by title, ID, project, team…" aria-label="Search tickets" autocomplete="off">
    </label>
    <div class="seg" role="group" aria-label="Group by">
      <span class="lab">Group</span>
      <button data-group="bucket" aria-pressed="true">Stage</button>
      <button data-group="project" aria-pressed="false">Project</button>
      <button data-group="none" aria-pressed="false">Flat</button>
    </div>
  </div>

  <div class="tablecard">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Ticket</th>
            <th>Stage</th>
            <th>Project</th>
            <th class="team">Team</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>

  <footer>Source: Notion Master Database · assignee = me · excludes Approved / Deployed / Archived / Aborted.</footer>
</div>

<script>
const BUCKETS = {
  ready:    { label:"Ready to develop", order:1, fg:"var(--ready-fg)",  bg:"var(--ready-bg)",  bar:"#2f9d6b" },
  stuck:    { label:"Stuck / stale",    order:2, fg:"var(--stuck-fg)",  bg:"var(--stuck-bg)",  bar:"#d0503f" },
  grooming: { label:"Pending · grooming", order:3, fg:"var(--groom-fg)", bg:"var(--groom-bg)", bar:"#c9962f" },
  review:   { label:"Pending · review", order:4, fg:"var(--review-fg)", bg:"var(--review-bg)", bar:"#3f6fd0" },
  qa:       { label:"Pending · QA",     order:5, fg:"var(--qa-fg)",     bg:"var(--qa-bg)",     bar:"#7d5bc0" },
  deploy:   { label:"Pending · deploy", order:6, fg:"var(--deploy-fg)", bg:"var(--deploy-bg)", bar:"#2b9aa0" },
  progress: { label:"In progress",      order:7, fg:"var(--prog-fg)",   bg:"var(--prog-bg)",   bar:"#6b76a0" },
};

const FLAG = {
  due:      { cls:"due", text:"Due" },
  security: { cls:"security", text:"Security" },
  stale:    { cls:"stale", text:"Stale" },
  bug:      { cls:"bug", text:"Bug" },
  epic:     { cls:"epic", text:"Epic" },
  win:      { cls:"win", text:"Quick-win" },
};

// Injected by the bkbn-my-queue skill. Each item:
// { id, title, status, bucket, project, team, url, flag?, flagText? }
const T = __TICKET_DATA__;

const state = { bucket: null, q: "", group: "bucket" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function bucketOrder(a, b) { return BUCKETS[a].order - BUCKETS[b].order; }

function renderSummary() {
  const counts = {};
  for (const k in BUCKETS) counts[k] = 0;
  T.forEach(t => { if (counts[t.bucket] != null) counts[t.bucket]++; });
  const el = document.getElementById("summary");
  let html = `<button class="stat all" data-bucket="" aria-pressed="${state.bucket===null}">
      <span class="n">${T.length}</span><span class="l">All</span></button>`;
  Object.keys(BUCKETS).sort(bucketOrder).forEach(k => {
    const b = BUCKETS[k];
    html += `<button class="stat" data-bucket="${k}" style="border-left-color:${b.bar}" aria-pressed="${state.bucket===k}">
        <span class="n" style="color:${b.fg}">${counts[k]}</span><span class="l">${b.label}</span></button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll(".stat").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.dataset.bucket || null;
    state.bucket = (state.bucket === k) ? null : k;
    render();
  }));
}

function pill(t) {
  const b = BUCKETS[t.bucket] || BUCKETS.progress;
  return `<span class="pill" style="background:${b.bg};color:${b.fg}"><span class="dot" style="background:${b.bar}"></span>${esc(t.status)}</span>`;
}
function flagTag(t) {
  if (!t.flag || !FLAG[t.flag]) return "";
  const f = FLAG[t.flag];
  return `<span class="flags"><span class="tag ${f.cls}">${esc(t.flagText || f.text)}</span></span>`;
}
function rowHtml(t) {
  const b = BUCKETS[t.bucket] || BUCKETS.progress;
  return `<tr class="row" style="border-left-color:${b.bar}">
    <td class="id"><a href="${esc(t.url)}" target="_blank" rel="noopener">#${esc(t.id)}</a></td>
    <td class="title">${esc(t.title)}${flagTag(t)}</td>
    <td>${pill(t)}</td>
    <td class="proj">${esc(t.project)}</td>
    <td class="team">${esc(t.team || "—")}</td>
  </tr>`;
}
function groupHeader(name, count, barColor) {
  const dot = barColor ? `<span class="gdot" style="background:${barColor}"></span>` : "";
  return `<tr class="grp"><td colspan="5"><div class="ghead">${dot}<span class="gname">${esc(name)}</span><span class="gcount">${count}</span></div></td></tr>`;
}

function render() {
  renderSummary();
  const q = state.q.trim().toLowerCase();
  let rows = T.filter(t => {
    if (state.bucket && t.bucket !== state.bucket) return false;
    if (!q) return true;
    return (t.id+" "+t.title+" "+t.project+" "+(t.team||"")+" "+t.status).toLowerCase().includes(q);
  });
  document.getElementById("openCount").textContent = `${rows.length} of ${T.length} tickets`;
  const body = document.getElementById("body");
  if (!rows.length) { body.innerHTML = `<tr><td colspan="5" class="empty">No tickets match this filter.</td></tr>`; return; }

  let html = "";
  if (state.group === "none") {
    rows.sort((a,b) => bucketOrder(a.bucket,b.bucket) || (+a.id - +b.id));
    html = rows.map(rowHtml).join("");
  } else if (state.group === "bucket") {
    Object.keys(BUCKETS).sort(bucketOrder).forEach(k => {
      const g = rows.filter(t => t.bucket === k);
      if (!g.length) return;
      html += groupHeader(BUCKETS[k].label, g.length, BUCKETS[k].bar);
      html += g.map(rowHtml).join("");
    });
  } else {
    const projs = [...new Set(rows.map(t => t.project))].sort((a,b) => String(a).localeCompare(String(b)));
    projs.forEach(p => {
      const g = rows.filter(t => t.project === p).sort((a,b) => bucketOrder(a.bucket,b.bucket) || (+a.id - +b.id));
      html += groupHeader(p, g.length, null);
      html += g.map(rowHtml).join("");
    });
  }
  body.innerHTML = html;
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
  state.group = btn.dataset.group;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  render();
}));

render();
</script>
