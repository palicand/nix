name: Update package flakes

on:
  schedule:
    - cron: "30 8 * * *"  # Daily 08:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - claude-code-native
          - codex
          - kotlin-lsp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run bumper script
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="pkgs/${{ matrix.package }}/default.nix"
          old=$(sed -n 's/^  version = "\([^"]*\)";.*/\1/p' "$file")

          if [[ "${{ matrix.package }}" == "claude-code-native" ]]; then
            python3 .github/scripts/bump-claude-code-native.py
          else
            "pkgs/${{ matrix.package }}/update.sh"
            new=$(sed -n 's/^  version = "\([^"]*\)";.*/\1/p' "$file")
            echo "old=$old" >> "$GITHUB_OUTPUT"
            echo "new=$new" >> "$GITHUB_OUTPUT"
            [[ "$old" == "$new" ]] && changed=false || changed=true
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/${{ matrix.package }}
          delete-branch: true
          commit-message: "chore: Update ${{ matrix.package }} to ${{ steps.bump.outputs.new }}"
          title: "chore: Update ${{ matrix.package }} to ${{ steps.bump.outputs.new }}"
          body: |
            Bumps `pkgs/${{ matrix.package }}` from `${{ steps.bump.outputs.old }}` to `${{ steps.bump.outputs.new }}`.

            Checksums were refreshed for all supported platforms.
          labels: |
            dependencies
            automated
