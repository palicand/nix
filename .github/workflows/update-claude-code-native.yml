name: Update claude-code-native

on:
  schedule:
    - cron: "30 8 * * *"  # Daily 08:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump claude-code-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run bumper script
        id: bump
        run: python3 .github/scripts/bump-claude-code-native.py

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/claude-code-native
          delete-branch: true
          commit-message: "chore: Update claude-code-native to ${{ steps.bump.outputs.new }}"
          title: "chore: Update claude-code-native to ${{ steps.bump.outputs.new }}"
          body: |
            Bumps `pkgs/claude-code-native` from `${{ steps.bump.outputs.old }}` to `${{ steps.bump.outputs.new }}`.

            Polled from <https://downloads.claude.ai/claude-code-releases/latest>; sha256s recomputed for all four platforms.
          labels: |
            dependencies
            automated
