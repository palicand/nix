name: Security scan

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vulnix:
    name: vulnix CVE scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build system closure
        run: nix build .#checks.aarch64-darwin.darwin --print-build-logs

      - name: Run vulnix
        id: scan
        run: |
          set -o pipefail
          WHITELIST_ARG=""
          if [ -f vulnix.toml ]; then
            WHITELIST_ARG="-w vulnix.toml"
          fi
          # vulnix exits 2 when vulnerabilities are found — capture instead of failing.
          set +e
          nix shell nixpkgs#vulnix -c vulnix $WHITELIST_ARG --json -C ./result \
            > vulnix.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

          # Human-readable summary
          nix shell nixpkgs#vulnix -c vulnix $WHITELIST_ARG -C ./result \
            > vulnix.txt 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnix-report
          path: |
            vulnix.json
            vulnix.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## vulnix scan"
            echo
            if [ -s vulnix.txt ]; then
              echo '```'
              cat vulnix.txt
              echo '```'
            else
              echo "No output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open / update tracking issue
        if: steps.scan.outputs.exit_code != '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$REPO" --state open \
            --label vulnix --json number --jq '.[0].number // empty')

          {
            echo "vulnix found vulnerabilities in the system closure."
            echo
            echo "**Workflow run:** $RUN_URL"
            echo
            echo "<details><summary>vulnix output</summary>"
            echo
            echo '```'
            cat vulnix.txt
            echo '```'
            echo
            echo "</details>"
          } > issue-body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file issue-body.md
          else
            gh label create vulnix --repo "$REPO" \
              --color D93F0B --description "CVEs in Nix closure" 2>/dev/null || true
            gh issue create --repo "$REPO" \
              --title "vulnix: CVEs detected in system closure" \
              --label vulnix \
              --body-file issue-body.md
          fi
